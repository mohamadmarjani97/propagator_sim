[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biowet-backend"
version = "0.1.0"
description = "FastAPI backend for BioWet biodiversity intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12"
]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.data", "app.services"]
